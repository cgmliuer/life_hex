name: Build Android APK (人生海克斯)

on:
push:
branches: [ main, master ]
workflow_dispatch:

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: 1. 检出代码
    uses: actions/checkout@v4

  - name: 2. 安装 Node.js 环境
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: 3. 配置 Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: 4. 配置 Android SDK
    uses: android-actions/setup-android@v3

  - name: 5. 初始化 Capacitor 并封装网页为 Android 工程
    run: |
      mkdir -p www
      if [ -f "index.html" ]; then
        cp index.html www/index.html
      elif [ -f "life_hextech.html" ]; then
        cp life_hextech.html www/index.html
      else
        echo "未找到 HTML 文件！" && exit 1
      fi
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android
      npx cap init "LifeHextech" "com.life.hextech" --web-dir www
      npx cap add android
      npx cap sync android

  - name: 6. 编译生成 Debug APK 安装包
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: 7. 上传生成好的 APK 供下载
    uses: actions/upload-artifact@v4
    with:
      name: LifeHextech-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
