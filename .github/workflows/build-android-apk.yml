name: Build Android APK (人生海克斯)

on:
push:
branches: [ main, master ]
workflow_dispatch: # 支持在 GitHub 网页端手动点击一键运行打包

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: 1. 检出代码
    uses: actions/checkout@v4

  - name: 2. 安装 Node.js 环境
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: 3. 配置 Java 17 (Android Gradle 必需)
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: 4. 初始化 Capacitor 并封装网页为 Android 工程
    run: |
      mkdir -p www
      cp index.html www/index.html
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android
      npx cap init "人生海克斯" "com.life.hextech" --web-dir www
      npx cap add android
      npx cap sync android

  - name: 5. 编译生成 Debug APK 安装包
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: 6. 上传生成好的 APK 供下载
    uses: actions/upload-artifact@v4
    with:
      name: LifeHextech-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
